- title: "Lecture | Lidia Zessin-Jurek: A Landscape in Motion: Jewish Refugee Spaces in Early Wartime Eastern Europe"
  url: /en/news/lecture-lidia-zessin-jurek/
  date: "10 December 2026"
  content: |
    EHRI-CZ, in collaboration with the Jewish Museum in Prague, cordially invites you to a lecture by Lidia Zessin-Jurek from the series Trends in Contemporary Holocaust Research, exploring Jewish refugee spaces in Eastern Europe during the early war period.