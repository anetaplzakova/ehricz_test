#    In September 2026, a new international project, the Holocaust Testimonies Portal, was launched to create a unified gateway for discovering and linking Holocaust testimonies across institutions worldwide. The Masaryk Institute and Archives of the CAS is among the partner institutions.
- title: "Lecture | Lidia Zessin-Jurek: A Landscape in Motion: Jewish Refugee Spaces in Early Wartime Eastern Europe"
  url: /en/news/lecture-lidia-zessin-jurek/
  date: "10 December 2026"
  content: |
    EHRI-CZ, in collaboration with the Jewish Museum in Prague, cordially invites you to a lecture by Lidia Zessin-Jurek from the series Trends in Contemporary Holocaust Research, exploring Jewish refugee spaces in Eastern Europe during the early war period.

- title: "Special Webinar | Holocaust Studies in Translation: Book Launch for Maria Ferenc’s “Everyone Asks What Will Happen to Us”"
  url: /en/news/webinar-book-launch-maria-ferenc/
  date: "19 October 2026, 6:00 PM CET"
  content: |
    The next EHRI webinar, part of the special series Holocaust Studies in Translation and organised together with the US Holocaust Memorial Museum, celebrates the launch of the English edition of Maria Ferenc’s book tracing how inhabitants of the Warsaw Ghetto wrestled with news and rumors about the Holocaust.

- title: "Workshop | Science is for Everyone: Citizen Science Workshop"
  url: /images/news/citizen-science-workshop/en.png
  date: "19 October 2026, 10:00–14:00"
  content: |
    The Institute of Physics of the Czech Academy of Sciences is hosting an interactive workshop as part of Open Science Week, exploring opportunities to engage the public in research across the natural sciences and humanities. The programme includes a mini-lecture by Jakub Trojan and presentations of citizen science projects, including [MemoMaps](https://memomap.cz). The event takes place in the A. Kochanovská Hall (FZU CAS, Pod Vodárenskou věží 3, Prague 8). For details, see the [event poster](/images/news/citizen-science-workshop/en.png) and the [FZU website](https://www.fzu.cz/akce/veda-je-pro-kazdeho-citizen-science-workshop).

- title: "EHRI Document Blog | \"Martyrs, Mothers, Heroines?\" (Self-)Representations of Female Concentration Camp Survivors in France, 1945"
  url: /en/news/ehri-blog-martyrs-mothers-heroines/
  date: "1 October 2026"
  content: |
    A new post on the EHRI Document Blog by Hannah Sprute examines the visual (self-)representation of female political concentration camp survivors in France in the immediate aftermath of liberation, exploring how former prisoners used photography to negotiate their identities.

- title: "Lecture | Vlasta Kordová: The Fight against the ‘Objective Enemies’ of the Third Reich. The Transformation of the Police into a Central Instrument of the Totalitarian State and Genocide"
  url: /en/news/lecture-vlasta-kordova/
  date: "26 October 2026"
  content: |
    EHRI-CZ, in collaboration with the Jewish Museum in Prague, invites you to a lecture by Vlasta Kordová from the series Trends in Contemporary Holocaust Research, examining the transformation of Nazi law and police practice into an instrument for the pre-emptive suppression of the ‘objective enemies’ of the Third Reich.

- title: "Lecture | Magdalena Sedlická and Aneta Plzáková: Holocaust in Space and Data – MemoMap and the EHRI-CZ Portal"
  url: /en/news/lecture-sedlicka-plzakova/
  date: "21 October 2026"
  content: |
    The Kurt and Ursula Schubert Center for Jewish Studies at Palacký University Olomouc invites you to a lecture by Magdalena Sedlická and Aneta Plzáková on the EHRI infrastructure, the MemoMap application, and the emerging EHRI-CZ Portal.