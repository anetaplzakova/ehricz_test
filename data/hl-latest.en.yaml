- title: "A New Season of the EHRI Podcast | For the Living and the Dead: Traces of the Holocaust"
  url: /en/news/ehri-podcast-roma-and-the-holocaust/
  date: "5 August 2026"
  content: |
    The fourth season of the EHRI Podcast series For the Living and the Dead features seven new episodes around the theme Roma and the Holocaust. New podcast host Lovro Kralj interviews seven experts sharing insights into stories that took their breath away.

- title: "DARIAH-CH Online Training Series 2026–2027"
  url: /en/news/dariah-ch-training-series-2026-2027/
  date: "September 2026 – May 2027"
  content: |
    DARIAH-CH is offering a free online training series covering various aspects of the Digital Humanities, including FAIR data, online editions, Wikidata and AI. The course aims at beginners and those who would like to improve their digital literacy.

- title: "Call for Papers | Actors, Witnesses, or Objects? Children in Postwar Central and Eastern Europe, 1945–1989"
  url: /en/news/cfp-actors-witnesses-or-subjects/
  date: "Deadline for abstract submissions: 18 September 2026"
  content: |
    The European Network for Remembrance and Solidarity (ENRS) and the Federal Institute for Culture and History of the Germans in Eastern Europe (BKGE) are organizing a conference focusing on children's postwar experiences marked by political division, forced emigration, ideological conflicts, and the rise of communist regimes.

- title: "Call for Applications | Mapping Jewish Communities: Spaces of History and Memory"
  url: /files/CfA_mapping_jewish_communities_EN.pdf
  date: "Application deadline: 25 August 2026"
  content: |
    The Philip Friedman Centre for Jewish Studies at the University of Łódź has issued a call for applications for the interdisciplinary workshop "Mapping Jewish Communities: Spaces of History and Memory," focusing on cities of important Jewish presence as multilayered spaces of history, memory, and contemporary heritage. The workshop will take place 23–25 September 2026 in Łódź, Poland.

- title: "Call for Applications: EHRI-ERIC Transnational Workshop | Documentation as Resistance"
  url: /en/news/cfp-workshop-documentation-as-resistance/
  date: "Deadline for applications: 24 August 2026"
  content: |
    A call for applications has been published for a two-day EHRI-ERIC transnational seminar entitled "Documentation as Resistance: Methodologies for Reconstructing Early Postwar Transnational Jewish Knowledge Networks", which will take place in London on 1–2 December 2026.

- title: "Document Blog EHRI | Secret notes from Austrian resistance members in Gestapo captivity"
  url: /en/news/ehri-blog-secret-notes-austrian-resistance/
  date: 30 July 2026
  content: |
    A new post on the EHRI Document Blog by Barnabas Balint examines clandestine notes (Kassiber) written by Elfriede Hartmann, a member of the Austrian anti-Nazi resistance, while imprisoned by the Gestapo.