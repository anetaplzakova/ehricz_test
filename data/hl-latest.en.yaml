- title: "EHRI webinar and podcast series | Persecution of the Roma"
  url: /en/news/webinar-persecution-of-the-roma/
  date: 5 August 2026
  content: |
    To coincide with the Roma Holocaust Memorial Day on 2 August, EHRI organises a special webinar focused on the history of the persecution of Roma during the Second World War on Wednesday August 5, 2pm CET.

- title: "Call for Applications: EHRI-ERIC Transnational Seminar | Holocaust Memoirs"
  url: /en/news/ehri-eric-seminar-holocaust-memoirs/
  date: "Deadline for applications: 16 August 2026"
  content: |
    The call for applications for the EHRI-ERIC Transnational Seminar "Holocaust Memoirs – Who Will Write Their History?", which will take place on 30 November – 4 December 2026 at the Terezin Memorial, has just been published.

- title: "Document Blog EHRI: The Extermination of Jews in the Kalinindorf Jewish National Raion"
  url: /en/news/ehri-blog-extermination-jews-kalinindorf/
  date: 29 June 2026
  content: |
    Based on newly discovered archival documents, this study reconstructs the course of the autumn 1941 massacres in the Kalinindorf Jewish National District, provides precise casualty figures, and sheds light on the role of local collaborators. The article is available in the [English version](https://blog.ehri-project.eu/2026/06/29/the-extermination-of-jews-in-the-kalinindorf/) as well as in the [Russian original](https://blog.ehri-project.eu/ru/2026/06/29/%D0%B8%D1%81%D1%82%D1%80%D0%B5%D0%B1%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5-%D0%B5%D0%B2%D1%80%D0%B5%D0%B5%D0%B2-%D0%B2-%D0%BA%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B4%D0%BE%D1%80%D1%84e/).

- title: "EHRI-CZ Fellow Emily Roche: Building Survival: Experiences of Architect Prisoners at Auschwitz"
  url: /en/news/ehri-eric-conny-kristel-fellowship-emily-roche/
  content: |
    The second fellow to complete a fellowship at the Jewish Museum in Prague this June is Dr. Emily Julia Roche. Her research focuses on the topic Building Survival: Experiences of Architect Prisoners at Auschwitz.

- title: "C4DHI Anniversary Workshop"
  url: /en/news/c4dhi-anniversary-workshop/
  date: 1-2 June 2026
  content: |
    We would like to invite you to a two-day workshop celebrating the third anniversary of the Centre for Digital Humanities Integration (C4DHI). The event will take place at the Jinonice Campus.

- title: "Conny Kristel Fellowship"
  url: https://www.ehri-project.eu/conny-kristel-fellowships/
  content: |
    The second call for the Conny Kristel Fellowship (under EHRI-ERIC) is now open. The fellowship offers researchers access to 25 collection-holding institutions across Europe, Israel, and the U.S. Applications can be submitted until June 7 (midnight CET).