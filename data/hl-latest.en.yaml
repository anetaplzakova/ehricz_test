- title: "EHRI-ERIC Transnational Seminar: Holocaust Memoirs – Who Will Write Their History?"
  url: /en/news/seminar-holocaust-memoirs-terezin/
  date: "30 November – 3 December 2026"
  content: |
    The Vienna Wiesenthal Institute and the Terezín Memorial are organizing an EHRI-ERIC seminar on Holocaust memoirs and ego-documents, including a public discussion with Alica Frühwaldová (30 November in Terezín).

- title: "Book Launch | Life Could Be So Beautiful"
  url: /en/news/book-launch-ruth-maier/
  date: "13 November and 1 December 2026"
  content: |
    Paseka and the Ruth Maier Foundation invite you to book launches and discussions on the graphic novel adaptation of Ruth Maier's diaries in Brno (13 November at Villa Löw-Beer) and Prague (1 December at Božská lahvice).

- title: "EHRI Webinar | Uncovering Emotional Contamination at Hospital No.1 in the Łódź Ghetto"
  url: /en/news/webinar-lodz-ghetto-hospital/
  date: "4 November 2026, 3:00 PM CET"
  content: |
    The next EHRI webinar will present researcher Abigail Zola's project exploring the architectural analysis of Hospital No. 1 in the Łódź Ghetto, survivor testimonies, and the concept of “emotional contamination” of traumatic spaces.

- title: "Holocaust Testimonies Portal: A New EHRI-ERIC Project"
  url: /en/news/holocaust-testimonies-portal/
  date: "8 October 2026"
  content: |
    In September 2026, a new international project, the Holocaust Testimonies Portal, was launched to create a unified gateway for discovering and linking Holocaust testimonies across institutions worldwide. The Masaryk Institute and Archives of the CAS is among the partner institutions.

- title: "Lecture and Discussion | Denmark 1943: When Society Decides to Help"
  url: /en/news/lecture-straede-katznelson/
  date: "4 November 2026, 4:00 PM"
  content: |
    The Terezín Initiative Institute invites to a lecture by Danish historian Prof. Therkel Stræde and an encounter with Danish Jewish survivor Ib Katznelson, accompanied by an exhibition on the rescue of Danish Jews at the Faculty of Arts, Charles University.

