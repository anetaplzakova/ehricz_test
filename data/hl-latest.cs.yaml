- title: "MemoMap na Praze 7"
  url: /news/memomap-na-praze-7/
  date: "22. října 2026, 16:00"
  content: |
    Vydejte se s námi na procházku po Praze 7, během níž se seznámíte s aplikací [MemoMap Praha](https://memomap.cz), kterou vytvořil Masarykův ústav a Archiv AV ČR jako službu českého uzlu EHRI-CZ. Procházka je bezplatná, sraz u hotelu Mama Shelter.

- title: "Přednáška | Vlasta Kordová: Boj proti „objektivním nepřátelům“ Třetí říše. Transformace policie v ústřední nástroj totalitárního státu a genocidy"
  url: /news/lecture-vlasta-kordova/
  date: "26. října 2026"
  content: |
    EHRI-CZ ve spolupráci s Židovským muzeem v Praze zvou na prezentaci Vlasty Kordové z přednáškového cyklu Směry současného výzkumu holokaustu, věnovanou proměně nacistického práva a policejní praxe v nástroj preventivního potírání „objektivních nepřátel“ Třetí říše.

- title: "Přednáška | Magdalena Sedlická a Aneta Plzáková: Holokaust v prostoru a datech – MemoMap a Portál EHRI-CZ"
  url: /news/lecture-sedlicka-plzakova/
  date: "21. října 2026"
  content: |
    Centrum judaistických studií Kurta a Ursuly Schubertových FF UP v Olomouci zve na přednášku Magdaleny Sedlické a Anety Plzákové věnovanou infrastruktuře EHRI, aplikaci MemoMap a nově vznikajícímu Portálu EHRI-CZ.

- title: "Dokumentový blog EHRI | Victims of Brain Research during National Socialism"
  url: /news/ehri-blog-victims-of-brain-research/
  date: "31. srpna 2026"
  content: |
    Článek od Aisling Shalvey na Dokumentovém blogu EHRI popisuje, jak projekt Victims of Brain Research during National Socialism využívá výpovědi přeživších a archivní výzkum k dokumentaci nacistických lékařských experimentů a k obnovení identity obětí výzkumu mozku za nacismu.

- title: "Nová sezóna podcastu EHRI | For the Living and the Dead: Traces of the Holocaust"
  url: /news/ehri-podcast-roma-and-the-holocaust/
  date: "5. srpna 2026"
  content: |
    Čtvrtá sezóna série podcastů EHRI přináší sedm nových dílů věnovaných tématu Romové a holokaust. Nový moderátor podcastu Lovro Kralj vede rozhovory se sedmi odborníky, kteří líčí své postřehy a vyprávějí příběh o osobě nebo předmětu, který je nejvíce zasáhl.

- title: "DARIAH-CH Online vzdělávací cyklus 2026–2027"
  url: /news/dariah-ch-training-series-2026-2027/
  date: "září 2026 – květen 2027"
  content: |
    DARIAH-CH připravila bezplatnou online vzdělávací sérii zaměřenou na různé aspekty digitálních humanitních věd. Program je určen zejména začínajícím výzkumníkům, kteří si chtějí rozšířit své znalosti a zvýšit digitální gramotnost.