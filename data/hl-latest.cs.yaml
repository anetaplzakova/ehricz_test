- title: "Transnacionální seminář EHRI-ERIC: Holocaust Memoirs – Who Will Write Their History?"
  url: /news/seminar-holocaust-memoirs-terezin/
  date: "30. listopadu – 3. prosince 2026"
  content: |
    Vienna Wiesenthal Institute a Památník Terezín pořádají seminář EHRI-ERIC věnovaný memoárům a ego-dokumentům z holokaustu. Součástí je i veřejná beseda Moniky Vrzgulové s Alicí Frühwaldovou (30. listopadu v Terezíně).

- title: "Uvedení knihy | Život by mohl být tak krásný"
  url: /news/book-launch-ruth-maier/
  date: "13. listopadu a 1. prosince 2026"
  content: |
    Nakladatelství Paseka a Nadační fond Ruth Maier zvou na uvedení komiksového zpracování deníků Ruth Maierové v Brně (13. listopadu ve Vile Löw-Beer) a v Praze (1. prosince v knihkupectví Božská lahvice).

- title: "Webinář EHRI | Uncovering Emotional Contamination at Hospital No.1 in the Łódź Ghetto"
  url: /news/webinar-lodz-ghetto-hospital/
  date: "4. listopadu 2026, 15:00"
  content: |
    Příští webinář EHRI představí výzkum Abigail Zola zaměřený na architektonickou analýzu Nemocnice č. 1 v lodžském ghettu, orální historii přeživších a koncept „emocionální kontaminace“ traumatických míst.

- title: "Holocaust Testimonies Portal: nový projekt EHRI-ERIC"
  url: /news/holocaust-testimonies-portal/
  date: "8. října 2026"
  content: |
    V září 2026 byl zahájen nový mezinárodní projekt Holocaust Testimonies Portal, jehož cílem je vytvořit jednotný online portál pro vyhledávání a propojování svědectví o holokaustu napříč institucemi po celém světě. Na přípravné fázi projektu se podílí i Masarykův ústav a Archiv AV ČR.

- title: "Přednáška a beseda | Dánsko 1943: když se společnost rozhodne pomoci"
  url: /news/lecture-straede-katznelson/
  date: "4. listopadu 2026, 16:00"
  content: |
    Institut Terezínské iniciativy zve na přednášku dánského historika prof. Therkela Strædeho a setkání s dánským židovským pamětníkem Ibem Katznelsonem, doplněné výstavou o záchraně dánských Židů na Filozofické fakultě UK.

