#- title: "Holocaust Testimonies Portal: nový projekt EHRI-ERIC"
#  url: /news/holocaust-testimonies-portal/
#  date: "8. října 2026"
#  content: |
#    V září 2026 byl zahájen nový mezinárodní projekt Holocaust Testimonies Portal, jehož cílem je vytvořit jednotný online portál pro vyhledávání a propojování svědectví o holokaustu napříč institucemi po celém světě. Na přípravné fázi projektu se podílí i Masarykův ústav a Archiv AV ČR.
- title: "Přednáška | Lidie Zessin-Jurek: A Landscape in Motion: Jewish Refugee Spaces in Early Wartime Eastern Europe"
  url: /news/lecture-lidia-zessin-jurek/
  date: "10. prosince 2026"
  content: |
    EHRI-CZ ve spolupráci s Židovským muzeem v Praze srdečně zvou na další přednášku z cyklu Směry současného výzkumu holokaustu od Lidie Zessin-Jurek věnovanou prostorům židovských uprchlíků ve východní Evropě na počátku války.

- title: "Webinář EHRI | Anglický překlad knihy Marie Ferenc: Everyone Asks What Will Happen to Us"
  url: /news/webinar-book-launch-maria-ferenc/
  date: "19. října 2026, 18:00"
  content: |
    Příští webinář EHRI ze speciální série Holocaust Studies in Translation, pořádaný ve spolupráci s Muzeem památky holokaustu v USA (USHMM), představí anglické vydání knihy Marie Ferencové věnované osudům a vnímání zpráv o holokaustu mezi obyvateli varšavského ghetta.

- title: "Dokumentový blog EHRI | „Mučednice, matky, hrdinky?“ (Sebe-)ztvárnění žen, které přežily koncentrační tábory ve Francii, 1945"
  url: /news/ehri-blog-martyrs-mothers-heroines/
  date: "1. října 2026"
  content: |
    Příspěvek od Hannah Sprute se zabývá vizuálním (sebe)ztvárněním žen bezprostředně po osvobození, které přežily politické koncentrační tábory ve Francii, a zkoumá, jak bývalé vězeňkyně využívaly obrazy k prosazování své identity jako odbojářek a přeživších v poválečné francouzské společnosti.

- title: "MemoMap na Praze 7"
  url: /news/memomap-na-praze-7/
  date: "22. října 2026, 16:00"
  content: |
    Vydejte se s námi na procházku po Praze 7, během níž se seznámíte s aplikací [MemoMap Praha](https://memomap.cz), kterou vytvořil Masarykův ústav a Archiv AV ČR jako službu českého uzlu EHRI-CZ. Procházka je bezplatná, sraz u hotelu Mama Shelter.

- title: "Přednáška | Vlasta Kordová: Boj proti „objektivním nepřátelům“ Třetí říše. Transformace policie v ústřední nástroj totalitárního státu a genocidy"
  url: /news/lecture-vlasta-kordova/
  date: "26. října 2026"
  content: |
    EHRI-CZ ve spolupráci s Židovským muzeem v Praze zvou na prezentaci Vlasty Kordové z přednáškového cyklu Směry současného výzkumu holokaustu, věnovanou proměně nacistického práva a policejní praxe v nástroj preventivního potírání „objektivních nepřátel“ Třetí říše.

- title: "Přednáška | Magdalena Sedlická a Aneta Plzáková: Holokaust v prostoru a datech – MemoMap a Portál EHRI-CZ"
  url: /news/lecture-sedlicka-plzakova/
  date: "21. října 2026"
  content: |
    Centrum judaistických studií Kurta a Ursuly Schubertových FF UP v Olomouci zve na přednášku Magdaleny Sedlické a Anety Plzákové věnovanou infrastruktuře EHRI, aplikaci MemoMap a nově vznikajícímu Portálu EHRI-CZ.