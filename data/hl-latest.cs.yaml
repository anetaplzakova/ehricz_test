- title: "Výzva k zasílání přihlášek na transnárodní seminář EHRI-ERIC | Holocaust Memoirs"
  url: /news/ehri-eric-seminar-holocaust-memoirs/
  date: "Uzávěrka přihlášek: 16. srpna 2026"
  content: |
    Byla zveřejněna výzva k předkládání přihlášek na transnárodní seminář EHRI-ERIC s názvem „Holocaust Memoirs – Who Will Write Their History?“, který se uskuteční ve dnech 30. listopadu – 4. prosince 2026 v Památníku Terezín.

- title: "Dokumentový blog EHRI: Vyhlazování židovských obyvatel v Kalinindorfském rajónu"
  url: /news/ehri-blog-extermination-jews-kalinindorf/
  date: 29. června 2026
  content: |
    Studie na základě nově objevených archivních dokumentů rekonstruuje průběh masakrů na podzim roku 1941 v Kalinindorfském židovském národním rajónu, zpřesňuje počty obětí a přibližuje roli místních kolaborantů. Článek je dostupný v [anglické verzi](https://blog.ehri-project.eu/2026/06/29/the-extermination-of-jews-in-the-kalinindorf/) i v [ruském originále](https://blog.ehri-project.eu/ru/2026/06/29/%D0%B8%D1%81%D1%82%D1%80%D0%B5%D0%B1%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5-%D0%B5%D0%B2%D1%80%D0%B5%D0%B5%D0%B2-%D0%B2-%D0%BA%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B4%D0%BE%D1%80%D1%84e/).

- title: "EHRI-CZ stipendistka Emily Roche: Building Survival: Experiences of Architect Prisoners at Auschwitz"
  url: /news/ehri-eric-conny-kristel-fellowship-emily-roche/
  content: |
    Druhou stipendistkou, která v červnu absolvuje stipendijní pobyt EHRI-ERIC Conny Kristel Fellowship v Židovském muzeu v Praze, je Dr. Emily Julia Roche. Vědecky zpracovává téma Building Survival: Experiences of Architect Prisoners at Auschwitz.

- title: "Přednáška Laura Hobson Faure | Who Will Rescue Us?"
  url: /news/lecture-laura-hobson-faure/
  date: 24. června 2026, 17.00
  content: |
    Přijďte si poslechnout přednášku historičky Laury Hobson Faure o osudech židovských dětí ve Francii a Spojených státech během holokaustu a po jeho skončení.

- title: "MÚA na Veletrhu vědy 2026"
  url: /news/mua-na-veletrhu-vedy-2026/
  date: 4.–6. června 2026
  content: |
    Poznejte historii holokaustu skrze prostor města na Veletrhu vědy 2026. Masarykův ústav a Archiv AV ČR představí aplikace MemoMap a další edukační aktivity pro děti i dospělé.

- title: "Conny Kristel Fellowship"
  url: https://www.ehri-project.eu/conny-kristel-fellowships/
  content: |
    Bylo vyhlášeno druhé kolo výzvy Conny Kristel Fellowship (v rámci EHRI-ERIC). Toto stipendium nabízí badatelům přístup do 25 paměťových a výzkumných institucí napříč Evropou, Izraelem a USA. Přihlášky je možné podávat do 7. června (do půlnoci SEČ).