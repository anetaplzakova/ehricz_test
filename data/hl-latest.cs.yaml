- title: "DARIAH-CH Online vzdělávací cyklus 2026–2027"
  url: /news/dariah-ch-training-series-2026-2027/
  date: "září 2026 – květen 2027"
  content: |
    DARIAH-CH připravila bezplatnou online vzdělávací sérii zaměřenou na různé aspekty digitálních humanitních věd. Program je určen zejména začínajícím výzkumníkům, kteří si chtějí rozšířit své znalosti a zvýšit digitální gramotnost.

- title: "Výzva k předkládání příspěvků | Actors, Witnesses or Subjects? Children in Post-war Central and Eastern Europe, 1945–1989"
  url: /news/cfp-actors-witnesses-or-subjects/
  date: "Uzávěrka přihlášek: 18. září 2026"
  content: |
    Evropská síť pro paměť a solidaritu (ENRS) a Spolkový institut pro kulturu a historii Němců ve východní Evropě (BKGE) pořádají konferenci „Actors, Witnesses or Subjects? Children in Post-war Central and Eastern Europe, 1945–1989“, s důrazem na poválečné zkušenosti dětí ve střední a východní Evropě.

- title: "Jak využít MemoMap ve výuce? Nové metodiky EHRI-CZ a Antikomplexu jsou dostupné ke stažení"
  url: /news/memomap-metodiky-antikomplex/
  content: |
    Tři nově vytvořené metodiky připravené spolkem Antikomplex ve spolupráci s EHRI-CZ ukazují, jak lze aplikaci MemoMap využít ve výuce dějepisu, výchovy k občanství či geografie. Metodiky jsou nyní volně ke stažení.

- title: "Výzva k zasílání přihlášek na workshop | Mapping Jewish Communities: Spaces of History and Memory"
  url: /files/CfA_mapping_jewish_communities_EN.pdf
  date: "Uzávěrka přihlášek: 25. srpna 2026"
  content: |
    Philip Friedman Centre for Jewish Studies Univerzity v Lodži vyhlásilo výzvu k zasílání přihlášek na interdisciplinární workshop „Mapping Jewish Communities: Spaces of History and Memory“, zaměřený na města s významnou židovskou přítomností jako vícevrstevnaté prostory dějin, paměti a soudobého dědictví. Workshop se koná 23.–25. září 2026 v polské Lodži.