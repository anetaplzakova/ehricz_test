- title: "Jak využít MemoMap ve výuce? Nové metodiky EHRI-CZ a Antikomplexu jsou dostupné ke stažení"
  url: /news/memomap-metodiky-antikomplex/
  content: |
    Tři nově vytvořené metodiky připravené spolkem Antikomplex ve spolupráci s EHRI-CZ ukazují, jak lze aplikaci MemoMap využít ve výuce dějepisu, výchovy k občanství či geografie. Metodiky jsou nyní volně ke stažení.

- title: "Výzva k zasílání přihlášek na workshop | Mapping Jewish Communities: Spaces of History and Memory"
  url: /files/CfA_mapping_jewish_communities_EN.pdf
  date: "Uzávěrka přihlášek: 25. srpna 2026"
  content: |
    Philip Friedman Centre for Jewish Studies Univerzity v Lodži vyhlásilo výzvu k zasílání přihlášek na interdisciplinární workshop „Mapping Jewish Communities: Spaces of History and Memory“, zaměřený na města s významnou židovskou přítomností jako vícevrstevnaté prostory dějin, paměti a soudobého dědictví. Workshop se koná 23.–25. září 2026 v polské Lodži.

- title: "Dokumentový blog EHRI | Tajné zprávy členů rakouského odboje v zajetí gestapa"
  url: /news/ehri-blog-secret-notes-austrian-resistance/
  date: 30. července 2026
  content: |
    Na stránkách EHRI Document Blogu naleznete nový příspěvek věnovaný tajným zprávám (Kassiber) Elfriede Hartmannové, rakouské členky protinacistického odboje vězněné gestapem. Autorem článku je Barnabas Balint.

- title: "Výzva pro zasílání přihlášek na nadnárodní workshop EHRI-ERIC | Documentation as Resistance"
  url: /news/cfp-workshop-documentation-as-resistance/
  date: "Uzávěrka přihlášek: 24. srpna 2026"
  content: |
    Byla zveřejněna výzva k předkládání přihlášek na dvoudenní nadnárodní seminář EHRI-ERIC s názvem „Documentation as Resistance: Methodologies for Reconstructing Early Postwar Transnational Jewish Knowledge Networks“, který se uskuteční 1.–2. prosince 2026 v Londýně.

- title: "Webinář a podcastová série EHRI | Perzekuce Romů"
  url: /news/webinar-persecution-of-the-roma/
  date: 5. srpna 2026
  content: |
    U příležitosti Pamětního dne romského holokaustu připravilo EHRI na 5. srpna 2026 webinář o perzekuci Romů v období druhé světové války, spojený s představením nové podcastové série.

- title: "Analýza potenciálu vzdělávacích aktivit ústavů AV ČR"
  url: /news/analyza-potencialu-vzdelavacich-aktivit/
  content: |
    Masarykův ústav a Archiv AV ČR se stal součástí nového projektu zaměřeného na zefektivnění využití vzdělávacích aktivit ústavů Akademie věd ve výuce na středních školách a lepší propojení výzkumných poznatků s výukou.